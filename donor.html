<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donor Dashboard</title>
  <link rel="stylesheet" href="style.css">
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}

header {
  background: #2e8b57;
  color: white;
  padding: 15px;
}

nav a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
}

.hero {
  text-align: center;
  padding: 50px;
}

.form-container {
  width: 300px;
  margin: 80px auto;
  background: white;
  padding: 20px;
  border-radius: 5px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  background: #2e8b57;
  color: white;
  border: none;
}

.card {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 5px;
}

</style>
</head>
<body>
 <div class="form-container">
  <h2>Donate Food</h2>
  <form class="dashboard">
    <input type="text" placeholder="Food Type">
    <input type="number" placeholder="Quantity">
    <input type="text" placeholder="Location">
    <input type="datetime-local">
    <button>Add Donation</button>
  </form>
</div>
</body>
</html>
