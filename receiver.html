<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receiver Dashboard</title>
  <link rel="stylesheet" href="style.css">
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}

header {
  background: #2e8b57;
  color: white;
  padding: 15px;
}

nav a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
}

.hero {
  text-align: center;
  padding: 50px;
}

.form-container {
  width: 300px;
  margin: 80px auto;
  background: white;
  padding: 20px;
  border-radius: 5px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  background: #2e8b57;
  color: white;
  border: none;
}

.card {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 5px;
}

</style>
</head>
<body>
  <h2>Available Food Donations</h2>
  <div class="card">
    <p><strong>Food:</strong> Rice</p>
    <p><strong>Quantity:</strong> 10 Plates</p>
    <p><strong>Location:</strong> City Center</p>
    <button>Request</button>
  </div>
</body>
</html>
